name: Verify Aggregator changes
on:
  push:
    branches: [main]
    paths:
      - 'subscribe/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'subscribe/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q subscribe tests
      - run: python -m unittest discover -s tests -v

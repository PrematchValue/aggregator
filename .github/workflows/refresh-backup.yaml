name: Refresh Backup Check
on:
  # The primary Refresh runs at 00:17,04:17,... UTC. Check 90 minutes later.
  # This workflow performs only a short API check unless a retry is required.
  schedule:
    - cron: "47 1-23/4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-backup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check missing or failed primary run, dispatch only if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u subscribe/refresh_backup.py

name: Daily Rules Refresh
on:
  schedule:
    # Beijing 10:13 daily (UTC 02:13); upstream code merge stays weekly.
    - cron: "13 2 * * *"
  workflow_dispatch:

concurrency:
  group: rules-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Refresh verified service rule snapshots
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          python -u subscribe/update_rules.py --update | tee /tmp/rule-update.log
          echo '### 规则更新结果' >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' /tmp/rule-update.log >> "$GITHUB_STEP_SUMMARY"
          python -m pip install -r requirements.txt
          python -u subscribe/update_rules.py
          python -u subscribe/external_rule_sets.py --write
          python -u subscribe/external_rule_sets.py
          python -m unittest discover -s tests -q
          git add -- subconverter/rules/auto subconverter/rules/export/singbox
          if git diff --cached --quiet; then
            echo '没有需要提交的规则变化' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified external rule snapshots'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo '主分支在更新过程中改变，本次跳过推送，保留旧规则' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin HEAD:main
          echo '已将通过校验的新规则快照提交至 main' >> "$GITHUB_STEP_SUMMARY"

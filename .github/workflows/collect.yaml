name: Collect
on:
  # Every Monday at 08:00 Asia/Shanghai (GitHub schedule cron uses UTC)
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Share the queue with Refresh, without killing an active run.
concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi
          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi
          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Collect
        # Look back 300 recent Telegram archive pages rather than the entire history.
        # Skip CAPTCHA-only airports to reduce futile registrations.
        # Structural validation is mandatory; TCP sampling is advisory, not a deletion rule.
        run: python -u subscribe/collect.py --all --overwrite --skip --pages 300 --skip-captcha --max-candidates 1500 --probe-sample 50 --geo-rename -t clash v2ray singbox surge

      - name: Timestamp
        run: date

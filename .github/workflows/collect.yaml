name: Weekly Upstream Check
on:
  # Every Monday at 08:00 Beijing time, GitHub cron is UTC.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Weekly workflow only checks and safely merges upstream code.
# Refresh handles all node discovery, validation, conversion and publication.
concurrency:
  group: collect-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check and safely merge upstream when verified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          if ! git fetch --no-tags https://github.com/wzdnzd/aggregator.git refs/heads/main; then
            echo "上游暂不可达，继续使用当前版本" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          UPSTREAM=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$UPSTREAM" "$BASE"; then
            echo "上游没有新提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-commit --no-ff "$UPSTREAM"; then
            git merge --abort || true
            echo "上游代码存在冲突，未自动合并，不阻止本周 Collect" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Preserve customized DNS, client and routing templates during safe merges.
          git restore --source="$BASE" --staged --worktree -- subconverter/base/all_base.tpl subconverter/pref.toml subconverter/snippets/groups.toml subconverter/snippets/rulesets.toml
          # A merge touching only protected files has no useful local changes.
          if git diff --cached --quiet; then
            git merge --abort || true
            echo "上游仅更改受保护模板，已保留 DNS／分流配置" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --cached --name-only "$BASE" | grep -Eq '^\.github/workflows/'; then
            git merge --abort || true
            echo "上游更改工作流，需要人工审查，跳过自动合并" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! (python -m pip install -r requirements.txt && python -m compileall -q subscribe tests && python -m unittest discover -s tests -q); then
            git merge --abort || true
            echo "上游合并版本测试未通过，保留稳定代码" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Merge upstream after regression tests"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "合并验证期间主分支已更新，本轮不推送" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin HEAD:main
          echo "上游代码已合并，通过测试并推送至 main" >> "$GITHUB_STEP_SUMMARY"

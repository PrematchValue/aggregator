name: Refresh
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      backup_slot:
        description: "Automatic backup slot (UTC); leave empty for manual runs"
        required: false
        type: string
        default: ""

concurrency:
  group: refresh-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.gate.outputs.run_refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip duplicate scheduled runs; allow manual runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_SLOT: ${{ github.event.inputs.backup_slot }}
        run: python -u subscribe/refresh_due.py

  process:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Gist credentials
        shell: bash
        run: |
          test -n "$GIST_PAT" && test -n "$GIST_LINK"
          [[ "$GIST_LINK" =~ ^[^/]+/[^/]+$ ]]
      - name: Upstream full discovery, liveness, egress labels, conversion and publication
        run: python -u subscribe/collect.py --all --overwrite --pages 500 --skip-captcha --geo-rename -t clash v2ray singbox surge

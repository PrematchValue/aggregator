name: Refresh
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Refresh must not wait behind a weekly full Collect run.
concurrency:
  group: refresh-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: x64
          cache: pip
      - run: pip3 install -r requirements.txt
      - name: Validate Gist credentials
        shell: bash
        run: |
          test -n "$GIST_PAT" && test -n "$GIST_LINK"
          [[ "$GIST_LINK" =~ ^[^/]+/[^/]+$ ]]
      - name: Refresh full discovery, rotate 2000 airports, maintain subscriptions
        run: python -u subscribe/collect.py --all --overwrite --refresh --pages 500 --skip-captcha --max-candidates 2000 --geo-rename -t clash v2ray singbox surge
      - run: date
